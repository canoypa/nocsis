publish_to: "none"

name: nocsis

environment:
  sdk: "^3.14.0"
  flutter: "3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.5.4
  google_fonts: ^9.0.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  json_annotation: ^4.8.1
  collection: ^1.18.0
  intl: ^0.20.2
  go_router: ^18.1.1
  animations: ^3.0.0
  dynamic_color: ^2.0.0
  material_ui: ^1.8.0
  gap: ^3.0.1
  shared_preferences: ^2.5.5
  nil: ^1.1.1
  chopper: ^8.5.2
  http: ^1.6.0
  http_parser: ^4.1.2
  web: ^1.1.2
  material_symbols_icons: ^4.2960.0
  qr_flutter: ^4.1.0
  cloud_firestore: ^7.2.0
  google_identity_services_web: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.15.1
  json_serializable: ^6.11.2
  go_router_builder: ^4.3.1
  chopper_generator: ^8.6.2
  swagger_dart_code_generator: ^4.1.1
  firebase_auth_mocks: ^0.16.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.5.0
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/weather/
    - assets/images/Icon-192.png
    - assets/images/google/google.png

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
