publish_to: "none"

name: nocsis

environment:
  sdk: "^3.10.0"
  flutter: "3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.9
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.5.4
  google_fonts: ^8.2.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  json_annotation: ^4.8.1
  collection: ^1.18.0
  intl: ^0.20.2
  go_router: ^17.2.3
  animations: ^3.0.0
  dynamic_color: ^1.7.0
  gap: ^3.0.1
  shared_preferences: ^2.5.5
  nil: ^1.1.1
  chopper: ^8.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  json_serializable: ^6.11.2
  go_router_builder: ^4.3.1
  chopper_generator: ^8.6.2
  swagger_dart_code_generator: ^4.1.1
  firebase_auth_mocks: ^0.15.1
  mocktail: ^1.0.5
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/weather/
    - assets/images/Icon-192.png
    - assets/images/google.svg

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
