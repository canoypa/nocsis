name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: Deploy to Production
  cancel-in-progress: false

jobs:
  deploy_backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy_backend.yml
    with:
      environment: Production
      promote: true

  deploy_functions:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy_functions.yml
    with:
      environment: Production

  build_frontend:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_frontend.yml
    with:
      environment: Production

  deploy_frontend:
    needs: [build_frontend, deploy_backend, deploy_functions]
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_deploy_frontend.yml
    with:
      environment: Production
      channel_id: live
    secrets: inherit
