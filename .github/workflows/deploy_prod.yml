name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: Deploy to Production
  cancel-in-progress: false

jobs:
  # environment の Deployment branches でも止まるが、そこに届く前にビルドが本番の
  # Artifact Registry へ push してしまう。
  check_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::本番デプロイは main からだけ流せる ($GITHUB_REF)"
            exit 1
          fi

  # ruleset の required check には任せない。admin が bypass できる。
  lint:
    needs: check_branch
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-lint.yml

  test:
    needs: check_branch
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test.yml

  build_backend:
    needs: check_branch
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-build_backend.yml
    with:
      persist: true

  build_functions:
    needs: check_branch
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build_functions.yml
    with:
      persist: true

  build_frontend:
    needs: check_branch
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build_frontend.yml
    with:
      persist: true

  deploy_backend:
    needs: [lint, test, build_backend]
    permissions:
      id-token: write
    uses: ./.github/workflows/reusable-deploy_backend.yml
    with:
      environment: Production
      image: ${{ needs.build_backend.outputs.image }}
      promote: true

  deploy_functions:
    needs: [lint, test, build_functions]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy_functions.yml
    with:
      environment: Production

  deploy_frontend:
    needs: [lint, test, build_frontend, deploy_backend, deploy_functions]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy_frontend.yml
    with:
      environment: Production
      expect_project_id: ${{ needs.build_frontend.outputs.project_id }}
