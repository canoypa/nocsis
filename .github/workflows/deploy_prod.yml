name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: Deploy to Production
  cancel-in-progress: false

jobs:
  # デプロイ経路自身が持つ最終防衛線。ruleset の required status check は
  # admin が bypass できるうえ workflow_dispatch は PR を経由しないため、
  # 「lint/test を通ったものだけが本番に出る」はリポジトリ内から保証されない。
  # 保証するのはそこまでで、「レビューを通ったものだけが出る」ではない。
  # workflow_dispatch は任意の ref を受け付ける(#1255)。
  #
  # build_* は待たせない。デプロイまでの時間を伸ばさないためであって、外に影響が
  # ないからではない。build_backend は persist: true で本番の Artifact Registry
  # へ image を push するので、ゲートが落ちた run でも image は残る(#1254)。
  # それがデプロイされないことは、_deploy_*.yml が workflow_call 専用で、呼び出し
  # 元がここと deploy_stg.yml だけ、という事実に依存している。
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build_backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build_backend.yml
    with:
      persist: true

  build_functions:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_functions.yml
    with:
      persist: true

  build_frontend:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_frontend.yml
    with:
      persist: true

  deploy_backend:
    needs: [lint, test, build_backend]
    permissions:
      id-token: write
    uses: ./.github/workflows/_deploy_backend.yml
    with:
      environment: Production
      image: ${{ needs.build_backend.outputs.image }}
      promote: true

  deploy_functions:
    needs: [lint, test, build_functions]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy_functions.yml
    with:
      environment: Production

  deploy_frontend:
    needs: [lint, test, build_frontend, deploy_backend, deploy_functions]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_deploy_frontend.yml
    with:
      environment: Production
      channel_id: live
      expect_project_id: ${{ needs.build_frontend.outputs.project_id }}
