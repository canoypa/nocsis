name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: Deploy to Production
  cancel-in-progress: false

jobs:
  deploy_backend:
    uses: ./.github/workflows/_deploy_backend.yml
    with:
      environment: Production
      promote: true

  deploy_functions:
    uses: ./.github/workflows/_deploy_functions.yml
    with:
      environment: Production

  deploy_frontend:
    needs: [deploy_backend, deploy_functions]
    uses: ./.github/workflows/_deploy_frontend.yml
    with:
      environment: Production
      channel_id: live
    secrets: inherit
