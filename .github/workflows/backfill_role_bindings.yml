name: Backfill role_bindings

# user_joined_groups の参加を role_bindings に写す (backend/scripts/backfill_role_bindings.ts)。
# 何度流しても増えない。Production environment は main からしか引けないので、本番は main で流す。
#
# 公開リポジトリの Actions のログは誰でも読めるので、スクリプトは件数しか出さない。
# uid を入力に取る grant はここから流さない。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "書き込む環境"
        type: choice
        options: [Staging, Production]
        default: Staging

permissions: {}

concurrency:
  group: Backfill role_bindings ${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backfill:
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-migrate@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Backfill
        run: pnpm run backfill-role-bindings -- --project "$PROJECT_ID" --yes
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
