name: Build Frontend

on:
  workflow_call:
    inputs:
      persist:
        description: "Keep the build output beyond this job (uploads a workflow artifact)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get --enforce-lockfile
      - name: Run build_runner
        working-directory: ./frontend
        run: flutter pub run build_runner build
      - name: Write Firebase config
        working-directory: ./frontend
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
        run: |
          mkdir -p dart_defines
          printf '%s' "$FIREBASE_WEB_CONFIG" > dart_defines/build.json
          # Flutter は空の定義ファイルを黙って受け入れるため、設定が空のまま
          # ビルドが成功しデプロイまで通ってしまう。ここで落とす。
          jq -e '(.FIREBASE_API_KEY // "") != ""' dart_defines/build.json > /dev/null || {
            echo "::error::Actions variable の FIREBASE_WEB_CONFIG が未設定か不正です。"
            exit 1
          }
      - name: Build
        working-directory: ./frontend
        run: flutter build web --wasm --dart-define-from-file=dart_defines/build.json
      - name: Upload Artifacts
        if: ${{ inputs.persist }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: ./frontend/build/web
