name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      channel_id:
        description: "Firebase Hosting channel ID"
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: ./frontend/build/web
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: github-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # channel_id は workflow_dispatch の入力に由来しうるので、run に展開せず
      # 環境変数として渡す。
      - name: Deploy
        id: deploy
        env:
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ "$CHANNEL_ID" = "live" ]; then
            pnpm firebase deploy --project "$PROJECT_ID" --only hosting
            exit 0
          fi
          # --silent が無いと pnpm 自身の出力が stdout に混ざり、JSON として
          # 読めなくなる。
          pnpm --silent firebase hosting:channel:deploy "$CHANNEL_ID" \
            --project "$PROJECT_ID" --expires 7d --json > channel.json
          if ! url=$(jq -er '.result | to_entries[0].value.url' channel.json); then
            echo "::error::プレビュー URL を取り出せませんでした。firebase の出力:"
            cat channel.json
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: ${{ steps.deploy.outputs.url && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Firebase Hosting のプレビュー: $URL"
