name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      expect_project_id:
        description: "Firebase project the downloaded build points at"
        required: false
        type: string

permissions: {}

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: ./frontend/build/web
      # ビルドの向き先はデプロイ先と同じでなければならない。違えば、staging の
      # Hosting に本番を向いたアプリが載る(逆も同じ)。設定はビルド側の入力、
      # デプロイ先は environment の変数で決まるため、両者は自動では一致しない。
      - name: Verify build target
        if: ${{ inputs.expect_project_id }}
        env:
          BUILT_FOR: ${{ inputs.expect_project_id }}
          DEPLOY_TO: ${{ vars.GCP_PROJECT_ID }}
        run: |
          [ "$BUILT_FOR" = "$DEPLOY_TO" ] || {
            echo "::error::ビルドは $BUILT_FOR 向けですが、デプロイ先は $DEPLOY_TO です。"
            exit 1
          }
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: pnpm firebase deploy --project "$PROJECT_ID" --only hosting
