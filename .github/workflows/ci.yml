name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci_${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-lint.yml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test.yml

  # main 向けの PR に絞らない。Renovate は development に自動マージするので、
  # 絞るとビルドを壊す更新がリリース PR まで素通りする。
  build-backend:
    permissions:
      contents: read
      # ここは persist しないので使わないが、reusable-build_backend.yml が宣言する権限を
      # 渡さないと call 自体が失敗する(呼び出し先の permissions は呼び出し側が上限)。
      id-token: write
    uses: ./.github/workflows/reusable-build_backend.yml

  build-functions:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build_functions.yml

  build-frontend:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build_frontend.yml

  # 個々のジョブを ruleset の必須チェックに並べない。ジョブを足すたびに ruleset の
  # 更新が要り、忘れると Renovate の自動マージが新しいジョブを待たずに通る。
  ci-ok:
    if: ${{ always() }}
    needs: [lint, test, build-backend, build-functions, build-frontend]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS" > /dev/null
