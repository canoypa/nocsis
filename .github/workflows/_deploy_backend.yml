name: Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      image:
        description: "Image built by _build_backend.yml"
        required: true
        type: string
      promote:
        description: "Promote to latest traffic after deploy"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # イメージの push 先はビルド側の入力、デプロイ先は environment の変数で
      # 決まるため、両者は自動では一致しない。別プロジェクトのイメージを渡された
      # まま進むと、デプロイ先から引けない参照で落ちるか、意図しない実体が載る。
      - name: Verify image target
        env:
          IMAGE: ${{ inputs.image }}
          DEPLOY_TO: ${{ vars.GCP_PROJECT_ID }}
        run: |
          case "$IMAGE" in
            */"$DEPLOY_TO"/*) ;;
            *)
              echo "::error::イメージ $IMAGE は $DEPLOY_TO のレジストリのものではありません。"
              exit 1
              ;;
          esac
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy Backend
        run: |
          gcloud run deploy backend \
            --image ${{ inputs.image }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region asia-northeast1 \
            --service-account backend-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-traffic
      - name: Set Traffic
        if: ${{ inputs.promote }}
        run: gcloud run services update-traffic backend --to-latest --project ${{ vars.GCP_PROJECT_ID }} --region asia-northeast1
