name: Build Backend

# Cloud Run のソースデプロイ(--source)を使わない。ビルドが deploy 側で起きると
# リリースPRのゲートは本番に出るイメージを検証できず、Dockerfile の破綻が
# デプロイ時まで露見しない。ここでビルドしたイメージを deploy が参照する。

on:
  workflow_call:
    inputs:
      push:
        description: "Push the built image to Artifact Registry"
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: "Built image reference (only pushed when push is true)"
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    env:
      IMAGE_REPO: asia-northeast1-docker.pkg.dev/class-clock-40088/cloud-run-source-deploy/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve image reference
        id: image
        run: |
          ref="${IMAGE_REPO}:${GITHUB_SHA}"
          echo "IMAGE=${ref}" >> "$GITHUB_ENV"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - name: Build image
        # Cloud Run は amd64 イメージのみ動かせる。runner の arch に依存させない。
        run: docker build --platform linux/amd64 --tag "$IMAGE" ./backend
      - name: Auth
        if: ${{ inputs.push }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/219141289630/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: gh-actions-deploy@class-clock-40088.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        if: ${{ inputs.push }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Configure Docker credentials
        if: ${{ inputs.push }}
        run: gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
      - name: Push image
        if: ${{ inputs.push }}
        run: docker push "$IMAGE"
