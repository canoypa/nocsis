name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-functions-${{ hashFiles('functions/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-functions-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test
      # 閾値割れでも数値を残すため、Test が落ちても実行する。
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### functions coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              echo "| metric | % | covered/total |"
              echo "| --- | --- | --- |"
              jq -r '.total | to_entries[]
                | select(.key | IN("statements","branches","functions","lines"))
                | "| \(.key) | \(.value.pct)% | \(.value.covered)/\(.value.total) |"' \
                coverage/coverage-summary.json
            else
              echo "レポートが生成されていません。Test の失敗内容を参照してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-backend-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-backend-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test
      # 閾値割れでも数値を残すため、Test が落ちても実行する。
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### backend coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              echo "| metric | % | covered/total |"
              echo "| --- | --- | --- |"
              jq -r '.total | to_entries[]
                | select(.key | IN("statements","branches","functions","lines"))
                | "| \(.key) | \(.value.pct)% | \(.value.covered)/\(.value.total) |"' \
                coverage/coverage-summary.json
            else
              echo "レポートが生成されていません。Test の失敗内容を参照してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Setup pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ./backend
      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-backend-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-backend-
      - name: Generate OpenAPI spec
        run: pnpm install --frozen-lockfile && pnpm run generate-openapi
        working-directory: ./backend
      - name: Setup build_runner cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/.dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('frontend/pubspec.lock', 'frontend/lib/**/*.dart', 'frontend/swagger/api.json', 'frontend/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-
      - name: Run build_runner
        run: flutter pub run build_runner build
      - name: Test
        run: flutter test --coverage
      - name: Check coverage threshold
        env:
          THRESHOLD: "15"
        run: |
          # 計測対象が 0 行のときは 0% ではなく計測失敗として扱う。
          pct=$(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END { if (lf == 0) exit 1; printf "%.2f", (lh / lf) * 100 }
          ' coverage/lcov.info) || {
            echo "coverage/lcov.info から行カバレッジを算出できませんでした" >&2
            exit 1
          }
          {
            echo "### frontend coverage"
            echo
            echo "| metric | % | threshold |"
            echo "| --- | --- | --- |"
            echo "| lines | ${pct}% | ${THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$pct" -v t="$THRESHOLD" 'BEGIN { printf "Line coverage: %s%% (threshold: %s%%)\n", p, t; exit (p + 0 >= t + 0) ? 0 : 1 }'
