name: Build Functions

on:
  workflow_call:
    inputs:
      persist:
        description: "Keep the build output beyond this job (uploads a workflow artifact)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@v5.2.9
      - name: Install dependencies
        working-directory: ./functions
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ./functions
        run: pnpm run build
      - name: Upload Artifacts
        if: ${{ inputs.persist }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: functions-build
          path: ./functions/dist
