name: Migrate Firestore

# backend/src/migrations の移行を名前で選んで流す (backend/scripts/migrate.ts)。
# 流せるのは backend/src/migrations/index.ts の一覧にあるものだけ。
# 既定は書き込まずに件数を数えるだけで、apply を付けたときだけ書き込む。
# Production environment は main からしか引けないので、本番は main で流す。
#
# 公開リポジトリの Actions のログは誰でも読めるので、移行は件数しか出さない。
# uid を入力に取る grant はここから流さない。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "書き込む環境"
        type: choice
        options: [Staging, Production]
        default: Staging
      name:
        description: "移行の名前 (backend/src/migrations/index.ts のキー)"
        type: string
        required: true
      apply:
        description: "書き込む (外すとドライラン)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: Migrate Firestore ${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-migrate@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # 入力は式で run に埋め込まず、環境変数で渡す。名前は migrate.ts が一覧と照らして弾く。
      - name: Migrate
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          MIGRATION_NAME: ${{ inputs.name }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--name "$MIGRATION_NAME" --project "$PROJECT_ID" --yes)
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          pnpm exec tsx scripts/migrate.ts "${args[@]}"
