name: Build Frontend

on:
  workflow_call:
    inputs:
      persist:
        description: "Keep the build output beyond this job (uploads a workflow artifact)"
        required: false
        type: boolean
        default: false
      firebase_web_config:
        description: "Firebase web config JSON (defaults to the production one)"
        required: false
        type: string
    outputs:
      project_id:
        description: "Firebase project the build points at"
        value: ${{ jobs.build.outputs.project_id }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.config.outputs.project_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get --enforce-lockfile
      - name: Run build_runner
        working-directory: ./frontend
        run: flutter pub run build_runner build
      # 設定は呼び出し元から渡す。このジョブに environment を宣言すれば環境変数で
      # 解決できるが、build ジョブが environment を持つと、その OIDC トークンは
      # attribute.environment 束縛の wlif-deploy を引けるようになる。build に
      # デプロイ権限を渡さないための境界なので、宣言しない。
      - name: Write Firebase config
        id: config
        working-directory: ./frontend
        env:
          FIREBASE_WEB_CONFIG: ${{ inputs.firebase_web_config || vars.FIREBASE_WEB_CONFIG }}
        run: |
          mkdir -p dart_defines
          printf '%s' "$FIREBASE_WEB_CONFIG" > dart_defines/build.json
          # Flutter は空の定義ファイルを黙って受け入れるため、設定が空のまま
          # ビルドが成功しデプロイまで通ってしまう。ここで落とす。
          jq -e '(.FIREBASE_API_KEY // "") != ""' dart_defines/build.json > /dev/null || {
            echo "::error::Firebase の web 設定が未設定か不正です。"
            exit 1
          }
          # デプロイ側が「このビルドが向いている先」と自分のデプロイ先を突き合わせ
          # られるようにする。設定の取得元(呼び出し元の入力)とデプロイ先の解決元
          # (environment の変数)は別なので、ここが唯一の照合点になる。
          project_id=$(jq -er '.FIREBASE_PROJECT_ID' dart_defines/build.json)
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      # 教室画面が version.json の build_number と埋め込んだ BUILD_NUMBER を比べて
      # 自分でリロードする。run_attempt を混ぜないのは、ジョブの再実行だけで全端末が
      # リロードしないようにするため
      #
      # エラーの報告は BUILD_COMMIT でソースマップを引く。ソースマップは Hosting に載せず、
      # デプロイのときに同じ github.sha のパスでバケットに置く (reusable-deploy_frontend.yml)。
      - name: Build
        working-directory: ./frontend
        env:
          BUILD_NUMBER: ${{ github.run_id }}
          BUILD_COMMIT: ${{ github.sha }}
        run: >-
          flutter build web --wasm --source-maps
          --dart-define-from-file=dart_defines/build.json
          --build-name=0.0.0
          --build-number="$BUILD_NUMBER"
          --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
          --dart-define=BUILD_COMMIT="$BUILD_COMMIT"
      - name: Upload Artifacts
        if: ${{ inputs.persist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: |
            ./frontend/build/web
            !./frontend/build/web/**/*.map
      # ソースマップはデプロイでバケットに置けば使い終わり、artifact に既定の期間残しても使い道がない。
      # 上の frontend-build からは .map を除き、.map だけをこの artifact に入れて、保持期間を最短の 1 日にする。
      - name: Upload Source Maps
        if: ${{ inputs.persist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-source-maps
          path: ./frontend/build/web/*.map
          retention-days: 1
          if-no-files-found: error
