name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      expect_project_id:
        description: "Firebase project the downloaded build points at"
        required: false
        type: string

permissions: {}

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@v5.2.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-build
          path: ./frontend/build/web
      - name: Download Source Maps
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-source-maps
          path: ./frontend/source-maps
      # ビルドの向き先はデプロイ先と同じでなければならない。違えば、staging の
      # Hosting に本番を向いたアプリが載る(逆も同じ)。設定はビルド側の入力、
      # デプロイ先は environment の変数で決まるため、両者は自動では一致しない。
      - name: Verify build target
        if: ${{ inputs.expect_project_id }}
        env:
          BUILT_FOR: ${{ inputs.expect_project_id }}
          DEPLOY_TO: ${{ vars.GCP_PROJECT_ID }}
        run: |
          [ "$BUILT_FOR" = "$DEPLOY_TO" ] || {
            echo "::error::ビルドは $BUILT_FOR 向けですが、デプロイ先は $DEPLOY_TO です。"
            exit 1
          }
      - name: Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1
      # Hosting より先に置く。後にすると、新しい版で起きたエラーが届いたときにまだ無く、
      # backend がしばらく「無い」と覚えてしまう。
      # 置けなくてもデプロイは止めない。エラーの報告が解読できなくなるだけで、画面は動く。
      # github.sha はビルドと同じ実行のものなので、アプリに埋め込んだ BUILD_COMMIT と一致する。
      # deploy には上書きの権限が無いので、同じ commit をやり直したときは既にあるものを飛ばす。
      - name: Upload source maps
        continue-on-error: true
        env:
          BUCKET: ${{ vars.GCP_PROJECT_ID }}-frontend-source-maps
          COMMIT: ${{ github.sha }}
        run: |
          gcloud storage cp --no-clobber \
            ./frontend/source-maps/main.dart.js.map \
            ./frontend/source-maps/main.dart.wasm.map \
            "gs://$BUCKET/$COMMIT/"
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: pnpm firebase deploy --project "$PROJECT_ID" --only hosting
