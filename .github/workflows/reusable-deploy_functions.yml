name: Deploy Functions

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@v5.3.0
        with:
          install_args: node pnpm
      # firebase deploy は関数定義の discovery で functions のコードを実行するため、
      # デプロイするだけでも functions 配下の node_modules が要る。root 側は CLI 用。
      # 取得を待つ時間が長いので成果物のダウンロードの裏で進め、認証より前に待ち合わせる。
      # 依存のインストールスクリプトを、デプロイの認証情報がある状態で走らせないため。
      - name: Install dependencies
        id: install
        background: true
        run: pnpm install --frozen-lockfile; cd functions && pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: functions-build
          path: ./functions/dist
      - name: Wait for dependencies
        wait: install
      - name: Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Deploy Functions and Security Rules
        run: pnpm firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --only functions,firestore:rules,firestore:indexes --force
