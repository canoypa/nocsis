name: Deploy

on:
  workflow_call:
    inputs:
      env:
        description: "Deployment environment (Preview or Production)"
        required: true
        type: string
      channelId:
        description: "Firebase Hosting channel id (required when env is Preview; Production always uses 'live')"
        required: false
        type: string
    secrets:
      DEPLOY_FIREBASE_HOSTING_SERVICE_ACCOUNT:
        required: true

permissions: {}

concurrency:
  group: Deploy

jobs:
  build_functions:
    permissions:
      contents: read
    environment:
      name: ${{ inputs.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Install dependencies
        working-directory: ./functions
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ./functions
        run: pnpm run build
      - name: Upload Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: functions-build
          path: ./functions/dist

  build_frontend:
    permissions:
      contents: read
    environment:
      name: ${{ inputs.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get --enforce-lockfile
      - name: Generate OpenAPI spec
        run: pnpm install --frozen-lockfile && pnpm run generate-openapi
        working-directory: ./backend
      - name: Run build_runner
        working-directory: ./frontend
        run: flutter pub run build_runner build
      - name: Build
        working-directory: ./frontend
        run: flutter build web --wasm
      - name: Upload Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-build
          path: ./frontend/build

  deploy_functions:
    needs: [build_functions]
    environment:
      name: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download Functions Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: functions-build
          path: ./functions/dist
      - name: Setup Tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile; cd functions && pnpm install --frozen-lockfile
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/219141289630/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: gh-actions-deploy@class-clock-40088.iam.gserviceaccount.com
      - name: Deploy Functions
        run: pnpm firebase deploy --only functions --force

  deploy_backend:
    environment:
      name: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/219141289630/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: gh-actions-deploy@class-clock-40088.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy Backend
        run: gcloud run deploy backend --source ./backend --project class-clock-40088 --region asia-northeast1 --no-traffic
      - name: Set Traffic
        if: inputs.env == 'Production'
        run: gcloud run services update-traffic backend --to-latest --project class-clock-40088 --region asia-northeast1

  deploy_frontend:
    needs: [build_frontend, deploy_functions, deploy_backend]
    environment:
      name: ${{ inputs.env }}
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download Frontend Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: ./frontend/build
      - name: Setup Tools
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Frontend
        id: deploy_frontend
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.DEPLOY_FIREBASE_HOSTING_SERVICE_ACCOUNT }}
          channelId: ${{ inputs.env == 'Production' && 'live' || inputs.channelId }}
