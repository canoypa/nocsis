name: Deploy Functions

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # firebase deploy は関数定義の discovery で functions のコードを実行するため、
      # デプロイするだけでも functions 配下の node_modules が要る。root 側は CLI 用。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile; cd functions && pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: functions-build
          path: ./functions/dist
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: github-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Deploy Functions and Security Rules
        run: pnpm firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --only functions,firestore:rules,firestore:indexes --force
