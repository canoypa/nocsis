name: Create Release Pull Request

on:
  push:
    branches: [develop]

permissions: {}

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Create Release Pull Request
        env:
          GH_TOKEN: ${{ secrets.CREATE_RELEASE_PR_TOKEN }}
        run: |
          pr_title=$(echo "Release $(TZ=Asia/Tokyo date +'%Y-%m-%d')")

          release_pr_number=$(gh pr list -B main -H develop --json "number" -q ".[0].number")
          if [ -z "$release_pr_number" ]; then
            release_pr_number=$(gh pr create -H develop -B main -t "$pr_title" -b "wip" --label "🚀 リリース" | sed -n 's/.*\///p')
          fi

          GRAPHQL_QUERY="$(cat <<'EOF'
          query ($owner: String!, $repo: String!, $prNumber: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $prNumber) {
                commits(first: 250) {
                  nodes {
                    commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          baseRefName
                          author { login }
                          number
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          EOF
          )"
          prs=$(gh api graphql -F query="$GRAPHQL_QUERY" -F owner="${{ github.repository_owner }}" -F repo="${{ github.event.repository.name }}" -F prNumber="$release_pr_number" \
                | jq '[.data.repository.pullRequest.commits.nodes[].commit.associatedPullRequests.nodes[] | select(.baseRefName == "develop")] | unique_by(.number)')

          body=$(echo "$prs" | jq -r '.[] | "- #\(.number) @\(.author.login)"')

          gh pr edit $release_pr_number -t "$pr_title" -b "$body"
