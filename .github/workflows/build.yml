name: Build

# branches を main に絞らない。Renovate は development に自動マージするので、
# 絞るとビルドを壊す更新がリリース PR まで素通りする。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    permissions:
      contents: read
      # ここは persist しないので使わないが、_build_backend.yml が宣言する権限を
      # 渡さないと call 自体が失敗する(呼び出し先の permissions は呼び出し側が上限)。
      id-token: write
    uses: ./.github/workflows/_build_backend.yml

  build-functions:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_functions.yml

  build-frontend:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_frontend.yml
