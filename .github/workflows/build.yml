name: Build

# main へのマージ前に「3つとも本番と同じ手順でビルドできるか」を見るゲート。
# ビルド手順は持たず、デプロイと同じ _build_*.yml を呼ぶだけ ── 手順を
# 二重管理しないため。ここは成果物を配らないので backend は push しない。
#
# main 向けPR(development→main のリリースPR)でのみ実行する。build は
# デプロイ成果物のコンパイルで、feature PR ごとに回すのは時間とコストに
# 見合わず、リリース前に検知できれば目的を満たす。

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    permissions:
      contents: read
      # _build_backend.yml が push 経路で要求する。呼び出し先の権限は
      # 呼び出し側が上限になるため、push しないここでも付与が必要。
      id-token: write
    uses: ./.github/workflows/_build_backend.yml

  build-functions:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_functions.yml

  build-frontend:
    permissions:
      contents: read
    uses: ./.github/workflows/_build_frontend.yml
