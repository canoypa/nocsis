name: Seed Staging

# Staging に架空のデータを入れる (backend/scripts/seed.ts)。何度流しても同じ状態になる。
#
# 公開リポジトリの Actions のログは誰でも読めるので、メールアドレスは Staging environment の
# secret から渡し、seed も件数しか出さない。
on:
  workflow_dispatch:
    inputs:
      join_allowed_users:
        description: "許可したアカウントをテストグループに所属させる (外すと未参加の画面を確かめられる)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: Seed Staging
  cancel-in-progress: false

jobs:
  seed:
    environment: Staging
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-action/providers/deploy-nocsis
          service_account: wlif-seed@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Seed
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          SEED_CLASSES_CALENDAR_ID: ${{ vars.SEED_CLASSES_CALENDAR_ID }}
          SEED_EVENTS_CALENDAR_ID: ${{ vars.SEED_EVENTS_CALENDAR_ID }}
          SEED_ALLOWED_EMAILS: ${{ secrets.SEED_ALLOWED_EMAILS }}
          SEED_JOIN_ALLOWED_USERS: ${{ inputs.join_allowed_users }}
        run: pnpm exec tsx scripts/seed.ts
